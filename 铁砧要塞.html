                max: 118,
                life: 0.32,
                damage: mine.owner === "player" ? 48 : 24,
                owner: mine.owner,
                color: mine.owner === "player" ? "#3f7d5a" : "#b3352f",
                ownerTank: mine.ownerTank || null,
              });
              mines.splice(i, 1);
            }
          }
        }

        function updateExplosions(dt) {
          for (let i = explosions.length - 1; i >= 0; i--) {
            const boom = explosions[i];
            const previous = boom.r;
            boom.life -= dt;
            boom.r = lerp(boom.r, boom.max, 1 - Math.pow(0.02, dt));
            if (!boom.visualOnly) {
              if (boom.owner === "player" || boom.owner === "neutral") {
                for (const enemy of [...enemies]) {
                  const d = distance(enemy, boom);
                  if (d < boom.r && d >= previous - 10)
                    damageEnemy(
                      enemy,
                      boom.damage * (1 - d / boom.max),
                      "爆震",
                      boom.ownerTank ||
                        (boom.owner === "player" ? player : null),
                    );
                }
              }
              if (
                (boom.owner === "enemy" || boom.owner === "neutral") &&
                distance(player, boom) < boom.r &&
                distance(player, boom) >= previous - 10
              ) {
                damagePlayer(boom.damage * 0.8, boom.ownerTank || null, boom.x, boom.y);
              }
              for (const barrel of barrels) {
                if (
                  barrel.alive &&
                  distance(barrel, boom) < boom.r + barrel.r
                ) {
                  barrel.hp = 0;
                  explodeBarrel(barrel);
                }
              }
            }
            if (boom.life <= 0) explosions.splice(i, 1);
          }
        }

        function explodeBarrel(barrel) {
          if (!barrel.alive) return;
          barrel.alive = false;
          explosions.push({
            x: barrel.x,
            y: barrel.y,
            r: 18,
            max: 180,
            life: 0.38,
            damage: 62,
            owner: "neutral",
            color: "#b45309",
          });
          burst(barrel.x, barrel.y, "#b45309", 36);
          shake(9);
        }

        function updateEffects(dt) {
          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.life -= dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vx *= Math.pow(0.04, dt);
            p.vy *= Math.pow(0.04, dt);
            if (p.life <= 0) particles.splice(i, 1);
          }
          for (let i = floaters.length - 1; i >= 0; i--) {
            const f = floaters[i];
            f.life -= dt;
            f.y -= dt * 34;
            if (f.life <= 0) floaters.splice(i, 1);
          }
        }

        function updateCamera(dt) {
          camera.x = lerp(camera.x, player.x, 1 - Math.pow(0.002, dt));
          camera.y = lerp(camera.y, player.y, 1 - Math.pow(0.002, dt));
          const zoom = getZoom();
          const marginX = view.w / zoom / 2;
          const marginY = view.h / zoom / 2;
          camera.x = clamp(camera.x, marginX, WORLD - marginX);
          camera.y = clamp(camera.y, marginY, WORLD - marginY);
        }

        function checkWave(dt) {
          if (enemies.length > 0) return;
          if (game.waveClearTimer <= 0) {
            game.waveClearTimer = 1.25;
            showToast(`第 ${game.wave} 轮肃清`);
          }
          game.waveClearTimer -= dt;
          if (game.waveClearTimer > 0) return;
          if (game.wave >= game.maxWave) {
            endGame(true);
            return;
          }
          game.state = "upgrade";
          openUpgrade();
        }

        function checkCompetitive(dt) {
          const config = modeConfig();
          if (config.respawn) {
            game.arenaTime -= dt;
            if (game.arenaTime <= 0) {
              endGame(playerRank() === 1);
              return;
            }
            while (enemies.length < config.bots) respawnArenaBot(null);
            return;
          }
          if (config.elimination && enemies.length === 0 && player.hp > 0) {
            endGame(true);
          }
        }

        function playerRank() {
          return arenaStandings().findIndex((row) => row.player) + 1;
        }

        function arenaStandings() {
          const rows = [
            {
              name: "本车",
              score: game.score,
              kills: player.kills,
              player: true,
            },
          ];
          for (const enemy of enemies) {
            rows.push({
              name: enemy.name,
              score: enemy.points || 0,
              kills: enemy.kills || 0,
              player: false,
            });
          }
          return rows.sort((a, b) => b.score - a.score || b.kills - a.kills);
        }

        function eliminationRank() {
          if (player.hp > 0 && enemies.length === 0) return 1;
          return Math.max(2, enemies.length + 1);
        }

        function respawnPlayer() {
          player.deaths += 1;
          dropParts(player.x, player.y, 4);
          burst(player.x, player.y, "#1d4e89", 34);
          const point = randomSpawnPoint();
          player.x = point.x;
          player.y = point.y;
          player.vx = 0;
          player.vy = 0;
          player.hp = Math.max(54, player.maxHp * 0.72);
          player.shieldUntil = performance.now() / 1000 + 1.4;
          showToast("战车再度部署");
        }

        function respawnArenaBot(oldBot) {
          if (!isRespawnMode() || game.state === "ended") return;
          const type = oldBot
            ? oldBot.type
            : ["scout", "heavy", "rocket", "miner"][
                Math.floor(Math.random() * 4)
              ];
          const bot = spawnEnemy(type, 0, 0, 3);
          if (oldBot) {
            bot.name = oldBot.name;
            bot.points = oldBot.points || 0;
            bot.kills = oldBot.kills || 0;
            bot.deaths = (oldBot.deaths || 0) + 1;
            bot.scrap = Math.max(1, Math.floor((oldBot.scrap || 0) * 0.5));
            bot.parts = oldBot.parts || [];
            for (const title of bot.parts) {
              const part = PARTS.find((item) => item.title === title);
              if (part) part.apply(bot);
            }
          } else {
            bot.name = BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
            bot.points = 0;
            bot.kills = 0;
            bot.deaths = 0;
            bot.scrap = 1;
            bot.parts = [];
          }
          bot.arena = true;
          bot.buildTimer = rand(3, 8);
        }

        function openPartShop() {
          if (!isCompetitiveMode() || game.state !== "playing") return;
          showToast("竞技图纸拾取后自动装机");
        }

        function openUpgrade() {
          upgradeGrid.innerHTML = "";
          const choices = pickUpgrades();
          upgradeTitle.textContent = `第 ${game.wave} 轮完成，选择整备`;
          for (const upgrade of choices) {
            const button = document.createElement("button");
            button.className = "af-refit-card";
            button.innerHTML = `<strong>${upgrade.title}</strong><span>${upgrade.text}</span>`;
            button.addEventListener("click", () => {
              upgrade.apply();
              healPlayer(player.maxHp * (garageSave.tech.recovery || 0) * 0.02);
              game.wave += 1;
              game.waveClearTimer = 0;
              spawnWave();
              game.state = "playing";
              upgradeOverlay.classList.add("af-veiled");
              showToast(`第 ${game.wave} 轮开工`);
              updateHud(true);
            });
            upgradeGrid.appendChild(button);
          }
          upgradeOverlay.classList.remove("af-veiled");
        }

        function pickUpgrades() {
          const bag = [...UPGRADES];
          const choices = [];
          while (choices.length < 3 && bag.length) {
            const index = Math.floor(Math.random() * bag.length);
            choices.push(bag.splice(index, 1)[0]);
          }
          return choices;
        }

        function endGame(won) {
          if (game.state === "ended") return;
          game.state = "ended";
          game.best = Math.max(game.best, game.score);
          garageSave.best = Math.max(garageSave.best || 0, game.best);
          const credits = Math.max(
            1,
            Math.floor(
              (game.score / 420 + player.kills * 1.4 + (won ? 10 : 0)) *
                (1 + (garageSave.tech.salvage || 0) * 0.06),
            ),
          );
          garageSave.credits += credits;
          garageSave.totalKills = (garageSave.totalKills || 0) + player.kills;
          garageSave.wins = (garageSave.wins || 0) + (won ? 1 : 0);
          const record = garageSave.records[selectedMode] || {
            plays: 0,
            wins: 0,
            best: 0,
            wave: 0,
          };
          record.plays += 1;
          record.wins += won ? 1 : 0;
          record.best = Math.max(record.best, Math.round(game.score));
          record.wave = Math.max(record.wave, game.wave || 0);
          garageSave.records[selectedMode] = record;
          garageSave.mastery.chassis[selectedChassis] =
            (garageSave.mastery.chassis[selectedChassis] || 0) + 1;
          garageSave.mastery.cannon[selectedCannon] =
            (garageSave.mastery.cannon[selectedCannon] || 0) + 1;
          const milestoneBonus = settleMilestones();
          saveGarage();
          if (isEliminationMode()) {
            const rank = won ? 1 : eliminationRank();
            overlayTitle.textContent = won ? "最终存者" : `淘汰排名第 ${rank}`;
            overlayText.textContent = won
              ? `你成为最后一辆尚能击发的战车，击毁 ${player.kills}，自动装机 ${player.parts.length} 张图纸。`
              : `你的战车遭淘汰，最终排名第 ${rank}，击毁 ${player.kills}，自动装机 ${player.parts.length} 张图纸。`;
          } else if (isCompetitiveMode()) {
            const rank = playerRank();
            const top = arenaStandings()
              .slice(0, 3)
              .map(
                (row, index) =>
                  `${index + 1}. ${row.name} ${Math.round(row.score)}`,
              )
              .join(" / ");
            overlayTitle.textContent =
              rank === 1 ? "抢分冠军" : `排名第 ${rank}`;
            overlayText.textContent = `限时抢分战结束，得分 ${Math.round(game.score)}，击毁 ${player.kills}，阵亡 ${player.deaths}，自动装机 ${player.parts.length} 张图纸。前三名：${top}。`;
          } else {
            overlayTitle.textContent = won ? "全场肃清" : "钢板失效";
            overlayText.textContent = won
              ? `你击穿了终局巨械，得分 ${Math.round(game.score)}。最高纪录 ${Math.round(game.best)}。`
              : `你的战车止步于第 ${game.wave} 轮，得分 ${Math.round(game.score)}。最高纪录 ${Math.round(game.best)}。`;
          }
          overlayText.textContent += ` 本次获得功绩 ${credits}。`;
          if (milestoneBonus)
            overlayText.textContent += ` 里程碑额外奖励 ${milestoneBonus} 功绩。`;
          startBtn.textContent = "再度部署";
          overlay.classList.remove("af-veiled");
          renderGarage();
          updateHud(true);
        }

        function formatTime(seconds) {
          const safe = Math.max(0, Math.ceil(seconds));
          const minutes = Math.floor(safe / 60);
          const remain = safe % 60;
          return `${minutes}:${String(remain).padStart(2, "0")}`;
        }

        function updateHud(force) {
          if (!player || (!force && game.state === "upgrade")) return;
          if (isEliminationMode()) {
            waveValue.textContent = `${enemies.length + (player.hp > 0 ? 1 : 0)}/16`;
            objectiveValue.textContent = "最终存者居首";
          } else if (isCompetitiveMode()) {
            waveValue.textContent = formatTime(game.arenaTime);
            objectiveValue.textContent = `第 ${playerRank()} 名 / 自动装机`;
          } else {
            waveValue.textContent = `${game.wave}/${game.maxWave}`;
          }
          scoreValue.textContent = Math.round(game.score);
          bestValue.textContent = Math.round(
            Math.max(game.best || 0, game.score),
          );
          enemyValue.textContent = enemies.length;
          armorValue.textContent = Math.round(player.hp);
          healthBar.style.width = `${clamp((player.hp / player.maxHp) * 100, 0, 100)}%`;
          reloadBar.style.width = `${clamp((1 - player.reloadLeft / player.reload) * 100, 0, 100)}%`;
          shellValue.textContent = player.shellName;
          bounceValue.textContent = String(player.bounces);
          partValue.textContent = isCompetitiveMode()
            ? String(player.parts.length)
            : String(player.scrap || 0);
          const skillNames = {
            vanguard: "磁涌冲击",
            interceptor: "迅驰超频",
            bastion: "重垒屏障",
            engineer: "工程驰援",
            specter: "幽影相位",
            juggernaut: "破阵震荡",
          };
          skillValue.textContent =
            player.skillLeft <= 0
              ? skillNames[player.chassis]
              : `${player.skillLeft.toFixed(1)}s`;
        }

        let shakePower = 0;
        function shake(amount) {
          shakePower = Math.min(18, shakePower + amount);
        }

        function burst(x, y, color, count) {
          for (let i = 0; i < count; i++) {
            const a = rand(0, Math.PI * 2);
            const s = rand(60, 340);
            particles.push({
              x,
              y,
              vx: Math.cos(a) * s,
              vy: Math.sin(a) * s,
              r: rand(2, 5),
              life: rand(0.35, 0.85),
              max: 0.85,
              color,
            });
          }
          if (particles.length > 520)
            particles.splice(0, particles.length - 520);
        }

        function spark(x, y, color, count) {
          burst(x, y, color, count);
        }

        function addFloater(text, x, y, color) {
          floaters.push({ text, x, y, color, life: 0.85, max: 0.85 });
          if (floaters.length > 80) floaters.shift();
        }

        function draw() {
          const zoom = getZoom();
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, view.w, view.h);
          ctx.fillStyle = "#f2ecdd";
          ctx.fillRect(0, 0, view.w, view.h);
          const sx = shakePower ? rand(-shakePower, shakePower) : 0;
          const sy = shakePower ? rand(-shakePower, shakePower) : 0;
          shakePower *= 0.86;
          if (shakePower < 0.1) shakePower = 0;
          ctx.save();
          ctx.translate(view.w / 2 + sx, view.h / 2 + sy);
          ctx.scale(zoom, zoom);
          ctx.translate(-camera.x, -camera.y);
          drawWorld();
          drawWalls();
          drawBarrels();
          drawParts();
          drawAirstrikes();
          drawMines();
          drawBullets();
          drawTanks();
          drawExplosions();
          drawParticles();
          drawFloaters();
          ctx.restore();
          drawVignette();
        }

        function drawWorld() {
          ctx.fillStyle = "#e9e1cd";
          ctx.fillRect(0, 0, WORLD, WORLD);
          ctx.strokeStyle = "rgba(30, 58, 95, 0.10)";
          ctx.lineWidth = 1;
          for (let x = 0; x <= WORLD; x += TILE) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, WORLD);
            ctx.stroke();
          }
          for (let y = 0; y <= WORLD; y += TILE) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(WORLD, y);
            ctx.stroke();
          }
          ctx.strokeStyle = "rgba(23, 58, 107, 0.55)";
          ctx.lineWidth = 10;
          ctx.strokeRect(5, 5, WORLD - 10, WORLD - 10);
        }

        function drawWalls() {
          for (const wall of walls) {
            const isSteel = wall.type === "steel";
            ctx.fillStyle = isSteel ? "#44547a" : "#8a5f52";
            ctx.strokeStyle = isSteel
              ? "rgba(135, 168, 204, 0.55)"
              : "rgba(255, 178, 95, 0.46)";
            ctx.lineWidth = 2;
            roundRect(
              wall.x - wall.w / 2,
              wall.y - wall.h / 2,
              wall.w,
              wall.h,
              6,
              true,
              true,
            );
            if (!isSteel) {
              ctx.fillStyle = `rgba(180, 83, 9, ${0.13 + (wall.hp / wall.maxHp) * 0.14})`;
              ctx.fillRect(wall.x - wall.w / 2 + 6, wall.y - 4, wall.w - 12, 8);
            }
          }
        }

        function drawBarrels() {
          for (const barrel of barrels) {
            if (!barrel.alive) continue;
            ctx.save();
            ctx.translate(barrel.x, barrel.y);
            ctx.fillStyle = "#6d4c2f";
            ctx.strokeStyle = "#b45309";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, barrel.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = "rgba(180, 83, 9, 0.35)";
            ctx.fillRect(-barrel.r * 0.62, -4, barrel.r * 1.24, 8);
            ctx.restore();
          }
        }

        function drawParts() {
          for (const part of parts) {
            ctx.save();
            ctx.translate(part.x, part.y);
            ctx.rotate(part.spin);
            ctx.fillStyle =
              part.kind === "module"
                ? "rgba(180, 83, 9, 0.17)"
                : part.kind === "repair"
                  ? "rgba(63, 125, 90, 0.16)"
                  : "rgba(29, 78, 137, 0.16)";
            ctx.strokeStyle = part.color;
            ctx.lineWidth = 2;
            roundRect(-11, -11, 22, 22, 5, true, true);
            ctx.strokeStyle = part.color;
            ctx.beginPath();
            if (part.kind === "repair") {
              ctx.moveTo(-6, 0);
              ctx.lineTo(6, 0);
              ctx.moveTo(0, -6);
              ctx.lineTo(0, 6);
            } else if (part.kind === "shield") {
              ctx.arc(0, 0, 6, 0, Math.PI * 2);
            } else {
              ctx.moveTo(-7, -4);
              ctx.lineTo(0, -8);
              ctx.lineTo(7, -4);
              ctx.moveTo(-7, 4);
              ctx.lineTo(0, 8);
              ctx.lineTo(7, 4);
            }
            ctx.stroke();
            ctx.restore();
          }
        }

        function drawAirstrikes() {
          for (const strike of airstrikes) {
            if (strike.exploded) continue;
            ctx.fillStyle = "rgba(179, 53, 47, 0.12)";
            ctx.strokeStyle = "rgba(160, 90, 44, 0.9)";
            ctx.lineWidth = 4;
            ctx.setLineDash([14, 10]);
            ctx.beginPath();
            ctx.arc(strike.x, strike.y, strike.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.setLineDash([]);
          }
        }

        function drawMines() {
          for (const mine of mines) {
            ctx.save();
            ctx.translate(mine.x, mine.y);
            ctx.strokeStyle = mine.owner === "player" ? "#3f7d5a" : "#b3352f";
            ctx.fillStyle =
              mine.arm > 0
                ? "rgba(159, 176, 200, 0.34)"
                : "rgba(255, 255, 255, 0.08)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, mine.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }
        }

        function drawBullets() {
          ctx.lineCap = "round";
          for (const bullet of bullets) {
            ctx.strokeStyle = bullet.color;
            ctx.lineWidth = bullet.r * 1.1;
            ctx.globalAlpha = 0.35;
            ctx.beginPath();
            ctx.moveTo(
              bullet.x - bullet.vx * 0.035,
              bullet.y - bullet.vy * 0.035,
            );
            ctx.lineTo(bullet.x, bullet.y);
            ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.fillStyle = bullet.color;
            ctx.beginPath();
            ctx.arc(bullet.x, bullet.y, bullet.r, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        function drawTanks() {
          for (const enemy of enemies) drawTank(enemy, false);
          for (const drone of drones) drawDrone(drone);
          drawTank(player, true);
        }

        function drawTank(tank, isPlayer) {
          const color = isPlayer ? "#1d4e89" : tank.color;
          const size = tank.size;
          ctx.save();
          ctx.translate(tank.x, tank.y);
          const hpRatio = tank.hp / tank.maxHp;
          if (!isPlayer) {
            ctx.fillStyle = "rgba(23, 37, 84, 0.18)";
            ctx.beginPath();
            ctx.ellipse(
              0,
              size * 0.38,
              size * 0.56,
              size * 0.24,
              0,
              0,
              Math.PI * 2,
            );
            ctx.fill();
          }
          ctx.rotate(tank.bodyAngle);
          ctx.fillStyle = isPlayer ? "#1c4d7c" : "#4a4a55";
          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          roundRect(
            -size * 0.5,
            -size * 0.36,
            size,
            size * 0.72,
            9,
            true,
            true,
          );
          ctx.fillStyle = "rgba(255, 255, 255, 0.38)";
          ctx.fillRect(-size * 0.42, -size * 0.47, size * 0.84, 5);
          ctx.fillRect(-size * 0.42, size * 0.42, size * 0.84, 5);
          ctx.restore();

          ctx.save();
          ctx.translate(tank.x, tank.y);
          ctx.rotate(tank.turretAngle);
          ctx.strokeStyle = color;
          ctx.lineWidth = isPlayer ? 8 : 6;
          ctx.beginPath();
          ctx.moveTo(size * 0.08, 0);
          ctx.lineTo(size * 0.72, 0);
          ctx.stroke();
          ctx.fillStyle = isPlayer ? "#143a5e" : "#3c3c46";
          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 0, size * 0.27, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();

          if (isPlayer && player.shieldUntil > performance.now() / 1000) {
            ctx.strokeStyle = "rgba(29, 78, 137, 0.72)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(
              tank.x,
              tank.y,
              size * 0.78 + Math.sin(performance.now() / 90) * 3,
              0,
              Math.PI * 2,
            );
            ctx.stroke();
          }

          if (!isPlayer) {
            ctx.fillStyle = "rgba(23, 37, 84, 0.40)";
            ctx.fillRect(tank.x - size * 0.5, tank.y - size * 0.75, size, 5);
            ctx.fillStyle = hpRatio > 0.45 ? "#3f7d5a" : "#b3352f";
            ctx.fillRect(
              tank.x - size * 0.5,
              tank.y - size * 0.75,
              size * clamp(hpRatio, 0, 1),
              5,
            );
          }
        }

        function drawDrone(drone) {
          ctx.save();
          ctx.translate(drone.x, drone.y);
          ctx.strokeStyle = "#3f7d5a";
          ctx.fillStyle = "rgba(63, 125, 90, 0.18)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, 13, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        function drawExplosions() {
          for (const boom of explosions) {
            const alpha = clamp(boom.life / 0.4, 0, 1);
            ctx.strokeStyle = boom.color;
            ctx.globalAlpha = alpha;
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(boom.x, boom.y, boom.r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = boom.color;
            ctx.globalAlpha = alpha * 0.08;
            ctx.beginPath();
            ctx.arc(boom.x, boom.y, boom.r * 0.72, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
          }
        }

        function drawParticles() {
          for (const p of particles) {
            ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }

        function drawFloaters() {
          ctx.font = "700 16px Microsoft YaHei, Segoe UI, sans-serif";
          ctx.textAlign = "center";
          for (const f of floaters) {
            ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
            ctx.fillStyle = f.color;
            ctx.fillText(f.text, f.x, f.y);
          }
          ctx.globalAlpha = 1;
        }

        function drawVignette() {
          const grad = ctx.createRadialGradient(
            view.w / 2,
            view.h / 2,
            Math.min(view.w, view.h) * 0.2,
            view.w / 2,
            view.h / 2,
            Math.max(view.w, view.h) * 0.66,
          );
          grad.addColorStop(0, "rgba(0, 0, 0, 0)");
          grad.addColorStop(1, "rgba(61, 53, 40, 0.30)");
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, view.w, view.h);
        }

        function roundRect(x, y, w, h, r, fill, stroke) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + w - r, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + r);
          ctx.lineTo(x + w, y + h - r);
          ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          ctx.lineTo(x + r, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          if (fill) ctx.fill();
          if (stroke) ctx.stroke();
        }

        function loop(now) {
          const dt = Math.min(0.033, (now - lastFrame) / 1000);
          lastFrame = now;
          update(dt, now / 1000);
          draw();
          requestAnimationFrame(loop);
        }

        function setPointerFromEvent(event) {
          const rect = canvas.getBoundingClientRect();
          pointer.x = event.clientX - rect.left;
          pointer.y = event.clientY - rect.top;
          updatePointerWorld();
        }

        function resetMoveJoystick() {
          touchMove = { active: false, id: null, x: 0, y: 0, dx: 0, dy: 0 };
          moveJoystickThumb.style.left = "50%";
          moveJoystickThumb.style.top = "50%";
        }

        function updateMoveJoystick(event) {
          const rect = moveJoystick.getBoundingClientRect();
          const cx = rect.width / 2;
          const cy = rect.height / 2;
          const max = rect.width * 0.34;
          const rawX = event.clientX - rect.left - cx;
          const rawY = event.clientY - rect.top - cy;
          const len = Math.hypot(rawX, rawY);
          const scale = len > max ? max / len : 1;
          const dx = rawX * scale;
          const dy = rawY * scale;
          touchMove.dx = dx / max;
          touchMove.dy = dy / max;
          moveJoystickThumb.style.left = `${cx + dx}px`;
          moveJoystickThumb.style.top = `${cy + dy}px`;
        }

        function isTouchUiTarget(target) {
          return Boolean(
            target &&
            target.closest &&
            target.closest(
              "#afStick, .af-fire-btn, .af-device-btn, .af-console, button",
            ),
          );
        }

        window.addEventListener("resize", resize);
        window.addEventListener("keydown", (event) => {
          keys.add(event.code);
          if (event.code === "Space") {
            event.preventDefault();
            playerShoot();
          }
          if (
            event.code === "ShiftLeft" ||
            event.code === "ShiftRight" ||
            event.code === "KeyE"
          )
            useSkill();
          if (event.code === "KeyB") openPartShop();
          if (event.code === "KeyP") togglePause();
          if (event.code === "KeyR") newGame();
        });
        window.addEventListener("keyup", (event) => keys.delete(event.code));
        canvas.addEventListener("pointermove", setPointerFromEvent);
        canvas.addEventListener("pointerdown", (event) => {
          setPointerFromEvent(event);
          pointer.down = true;
          canvas.setPointerCapture(event.pointerId);
        });
        canvas.addEventListener("pointerup", () => {
          pointer.down = false;
        });
        canvas.addEventListener("pointercancel", () => {
          pointer.down = false;
        });
        canvas.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          useSkill();
        });

        moveJoystick.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          event.stopPropagation();
          touchMove.active = true;
          touchMove.id = event.pointerId;
          moveJoystick.setPointerCapture(event.pointerId);
          updateMoveJoystick(event);
        });
        moveJoystick.addEventListener("pointermove", (event) => {
          if (!touchMove.active || event.pointerId !== touchMove.id) return;
          event.preventDefault();
          event.stopPropagation();
          updateMoveJoystick(event);
        });
        function releaseMoveJoystick(event) {
          if (
            event &&
            touchMove.id !== null &&
            event.pointerId !== touchMove.id
          )
            return;
          if (event) {
            event.preventDefault();
            event.stopPropagation();
          }
          resetMoveJoystick();
        }
        moveJoystick.addEventListener("pointerup", releaseMoveJoystick);
        moveJoystick.addEventListener("pointercancel", releaseMoveJoystick);
        moveJoystick.addEventListener(
          "lostpointercapture",
          releaseMoveJoystick,
        );

        window.addEventListener(
          "touchstart",
          (event) => {
            for (const touch of event.changedTouches) {
              if (isTouchUiTarget(touch.target)) continue;
              if (touch.clientX < view.w * 0.48 && !touchMove.active) {
                touchMove = {
                  active: true,
                  id: touch.identifier,
                  x: touch.clientX,
                  y: touch.clientY,
                  dx: 0,
                  dy: 0,
                };
              } else if (!touchAim.active) {
                touchAim = {
                  active: true,
                  id: touch.identifier,
                  x: touch.clientX,
                  y: touch.clientY,
                };
                pointer.x = touch.clientX;
                pointer.y = touch.clientY;
                pointer.down = true;
              }
            }
          },
          { passive: false },
        );
        window.addEventListener(
          "touchmove",
          (event) => {
            for (const touch of event.changedTouches) {
              if (isTouchUiTarget(touch.target)) continue;
              if (touch.identifier === touchMove.id) {
                const dx = touch.clientX - touchMove.x;
                const dy = touch.clientY - touchMove.y;
                const n = norm(dx, dy);
                const power = clamp(Math.hypot(dx, dy) / 72, 0, 1);
                touchMove.dx = n.x * power;
                touchMove.dy = n.y * power;
              }
              if (touch.identifier === touchAim.id) {
                pointer.x = touch.clientX;
                pointer.y = touch.clientY;
              }
            }
            updatePointerWorld();
          },
          { passive: false },
        );
        window.addEventListener("touchend", endTouch, { passive: false });
        window.addEventListener("touchcancel", endTouch, { passive: false });

        function endTouch(event) {
          for (const touch of event.changedTouches) {
            if (isTouchUiTarget(touch.target)) continue;
            if (touch.identifier === touchMove.id)
              touchMove = { active: false, id: null, x: 0, y: 0, dx: 0, dy: 0 };
            if (touch.identifier === touchAim.id) {
              touchAim = { active: false, id: null, x: 0, y: 0 };
              pointer.down = false;
            }
          }
        }

        pauseBtn.addEventListener("click", togglePause);
        restartBtn.addEventListener("click", newGame);
        fireBtn.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          event.stopPropagation();
          pointer.down = true;
          playerShoot();
        });
        fireBtn.addEventListener("pointerup", (event) => {
          event.preventDefault();
          event.stopPropagation();
          pointer.down = false;
        });
        fireBtn.addEventListener("pointercancel", () => {
          pointer.down = false;
        });
        skillBtn.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          event.stopPropagation();
          useSkill();
        });
        skillBtn.addEventListener("contextmenu", (event) =>
          event.preventDefault(),
        );
        function buzz(ms) {
          if (navigator.vibrate) {
            try {
              navigator.vibrate(ms);
            } catch (_) {}
          }
        }
        autoFireBtn.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          event.stopPropagation();
          autoFire = !autoFire;
          autoFireBtn.classList.toggle("af-on", autoFire);
          autoFireBtn.title = autoFire ? "自动击发：开" : "自动击发：关";
          if (autoFire) buzz(10);
        });
        autoFireBtn.addEventListener("contextmenu", (event) =>
          event.preventDefault(),
        );
        startBtn.addEventListener("click", newGame);
        modeGrid.addEventListener("click", (event) => {
          const button = event.target.closest("[data-af-mode]");
          if (!button) return;
          selectedMode = button.dataset.afMode;
          modeButtons.forEach((item) =>
            item.classList.toggle("af-on", item === button),
          );
          saveGarage();
        });
        chassisGrid.addEventListener("click", (event) => {
          const button = event.target.closest("[data-af-chassis]");
          if (!button) return;
          selectedChassis = button.dataset.afChassis;
          saveGarage();
          renderGarage();
        });
        cannonGrid.addEventListener("click", (event) => {
          const button = event.target.closest("[data-af-cannon]");
          if (!button) return;
          selectedCannon = button.dataset.afCannon;
          saveGarage();
          renderGarage();
        });
        armoryGrid.addEventListener("click", (event) => {
          const button = event.target.closest("[data-af-armory]");
          if (button) buyArmory(button.dataset.afArmory);
        });
        exportSaveBtn.addEventListener("click", async () => {
          const code = encodeGarageSave();
          try {
            await navigator.clipboard.writeText(code);
          } catch (error) {}
          prompt("铁砧要塞图纸码（已尝试复制，可在其他设备导入）", code);
        });
        importSaveBtn.addEventListener("click", () => {
          const code = prompt("粘贴铁砧要塞图纸码：");
          if (!code) return;
          try {
            decodeGarageSave(code);
            alert("图纸码导入成功，机库与纪录已恢复。");
          } catch (error) {
            alert(`导入失败：${error.message}`);
          }
        });

        function togglePause() {
          if (!game.state || game.state === "ended" || game.state === "upgrade")
            return;
          game.state = game.state === "paused" ? "playing" : "paused";
          pauseBtn.textContent = game.state === "paused" ? "▶" : "Ⅱ";
          showToast(game.state === "paused" ? "已搁置" : "恢复作业");
        }

        resize();
        player = makePlayer();
        camera.x = player.x;
        camera.y = player.y;
        bestValue.textContent = garageSave.best || 0;
        generateArena();
        modeButtons.forEach((button) =>
          button.classList.toggle(
            "af-on",
            button.dataset.afMode === selectedMode,
          ),
        );
        renderGarage();
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
