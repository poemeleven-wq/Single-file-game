<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>铁砧要塞：蓝图纪元 V3</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f2ecdd;
        --card: rgba(255, 253, 247, 0.94);
        --ink: #1e3a5f;
        --ink-soft: #46536b;
        --line: rgba(30, 58, 95, 0.38);
        --muted: #6b7a90;
        --amber: #b45309;
        --rust: #b3352f;
        --serif: "Songti SC", "Noto Serif SC", "SimSun", Georgia, serif;
        --mono: "JetBrains Mono", "Cascadia Mono", Consolas, "Courier New",
          monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        color: var(--ink);
        font-family: var(--serif);
        touch-action: none;
        user-select: none;
        background:
          repeating-linear-gradient(
            0deg,
            rgba(30, 58, 95, 0.05) 0 1px,
            transparent 1px 26px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(30, 58, 95, 0.05) 0 1px,
            transparent 1px 26px
          ),
          var(--paper);
      }

      canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        background: #f2ecdd;
      }

      button {
        font: inherit;
        color: inherit;
        border: 1.5px solid var(--line);
        border-radius: 2px;
        background: var(--card);
        cursor: pointer;
        font-family: var(--mono);
        letter-spacing: 0.08em;
        transition:
          transform 120ms ease,
          background 120ms ease,
          border-color 120ms ease,
          box-shadow 120ms ease;
      }

      button:hover {
        border-color: var(--amber);
        background: #fffdf6;
        box-shadow: 3px 3px 0 rgba(180, 83, 9, 0.25);
      }

      button:active {
        transform: translate(1px, 1px);
        box-shadow: none;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .af-plate {
        background: var(--card);
        border: 1.5px solid var(--ink);
        box-shadow: 5px 5px 0 rgba(30, 58, 95, 0.16);
        outline: 1px dashed rgba(30, 58, 95, 0.3);
        outline-offset: 3px;
      }

      .af-draft {
        position: fixed;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        padding: calc(10px + env(safe-area-inset-top, 0px))
          calc(12px + env(safe-area-inset-right, 0px)) 10px
          calc(12px + env(safe-area-inset-left, 0px));
      }

      .af-nameplate {
        position: absolute;
        top: calc(10px + env(safe-area-inset-top, 0px));
        left: calc(12px + env(safe-area-inset-left, 0px));
        width: min(430px, calc(100vw - 24px));
        padding: 10px 12px;
      }

      .af-nameplate h1 {
        margin: 0 0 8px;
        font-size: 17px;
        letter-spacing: 0.06em;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .af-nameplate h1 b {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 400;
        color: var(--amber);
        letter-spacing: 0.14em;
      }

      .af-gauges {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
      }

      .af-gauge {
        border-left: 2px solid var(--amber);
        padding-left: 6px;
      }

      .af-gauge-label {
        font-family: var(--mono);
        font-size: 9px;
        color: var(--muted);
        letter-spacing: 0.18em;
      }

      .af-gauge-value {
        font-size: 19px;
        font-variant-numeric: tabular-nums;
      }

      .af-bars {
        margin-top: 8px;
        display: grid;
        gap: 4px;
      }

      .af-bar {
        height: 7px;
        border: 1px solid var(--ink);
        background: rgba(30, 58, 95, 0.08);
      }

      .af-bar span {
        display: block;
        height: 100%;
        background: var(--amber);
      }

      .af-bar.af-warm span {
        background: var(--ink-soft);
      }

      .af-margin {
        position: absolute;
        top: calc(10px + env(safe-area-inset-top, 0px));
        right: calc(12px + env(safe-area-inset-right, 0px));
        width: 180px;
        padding: 10px 12px;
      }

      .af-margin h2 {
        margin: 0 0 8px;
        font-size: 12px;
        font-family: var(--mono);
        letter-spacing: 0.2em;
        color: var(--muted);
      }

      .af-margin-list {
        display: grid;
        gap: 5px;
      }

      .af-margin-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        border-bottom: 1px dotted var(--line);
        padding-bottom: 4px;
      }

      .af-margin-row span {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.12em;
      }

      .af-margin-row strong {
        font-weight: 600;
      }

      .af-console {
        position: absolute;
        left: 50%;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        pointer-events: auto;
      }

      .af-stamp-btn {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 15px;
        border: 1.5px solid var(--ink);
      }

      .af-stamp-btn.af-auto.af-on {
        background: var(--ink);
        color: var(--paper);
        border-color: var(--amber);
      }

      .af-device-btn,
      .af-fire-btn {
        position: fixed;
        right: calc(20px + env(safe-area-inset-right, 0px));
        width: 66px;
        height: 66px;
        border-radius: 50%;
        display: none;
        place-items: center;
        pointer-events: auto;
        border: 2px solid var(--ink);
        font-size: 22px;
      }

      .af-fire-btn {
        bottom: calc(26px + env(safe-area-inset-bottom, 0px));
        background: var(--amber);
        color: #fff8ec;
      }

      .af-device-btn {
        bottom: calc(102px + env(safe-area-inset-bottom, 0px));
        width: 54px;
        height: 54px;
        right: calc(30px + env(safe-area-inset-right, 0px));
        font-size: 19px;
      }

      .af-stick {
        position: fixed;
        left: calc(14px + env(safe-area-inset-left, 0px));
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        width: 114px;
        height: 114px;
        display: none;
        z-index: 4;
        touch-action: none;
      }

      .af-stick-base {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1.5px dashed var(--ink);
        background:
          radial-gradient(circle, rgba(30, 58, 95, 0.1) 0 2px, transparent 3px),
          repeating-linear-gradient(
            0deg,
            rgba(30, 58, 95, 0.1) 0 1px,
            transparent 1px 22px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(30, 58, 95, 0.1) 0 1px,
            transparent 1px 22px
          ),
          var(--card);
      }

      .af-stick-nub {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        border: 2px solid var(--ink);
        background: var(--amber);
        box-shadow: 2px 2px 0 rgba(30, 58, 95, 0.3);
      }

      .af-note {
        position: fixed;
        left: 50%;
        bottom: calc(76px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%) translateY(8px);
        padding: 7px 16px;
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.1em;
        border: 1.5px dashed var(--amber);
        background: #fffdf4;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 160ms ease,
          transform 160ms ease;
        z-index: 5;
        max-width: calc(100vw - 32px);
        text-align: center;
      }

      .af-note.af-show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .af-curtain {
        position: fixed;
        inset: 0;
        z-index: 8;
        display: grid;
        place-items: center;
        overflow-y: auto;
        padding: calc(18px + env(safe-area-inset-top, 0px)) 14px
          calc(18px + env(safe-area-inset-bottom, 0px));
        background:
          repeating-linear-gradient(
            0deg,
            rgba(30, 58, 95, 0.05) 0 1px,
            transparent 1px 26px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(30, 58, 95, 0.05) 0 1px,
            transparent 1px 26px
          ),
          rgba(242, 236, 221, 0.96);
      }

      .af-veiled {
        display: none;
      }

      .af-cover {
        width: min(880px, 100%);
        padding: 22px 24px;
        display: grid;
        gap: 16px;
      }

      .af-cover-head {
        border-bottom: 2px solid var(--ink);
        padding-bottom: 10px;
      }

      .af-cover-kicker {
        margin: 0 0 6px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.3em;
        color: var(--amber);
      }

      .af-cover h2 {
        margin: 0;
        font-size: 26px;
        letter-spacing: 0.1em;
      }

      .af-cover > p {
        margin: 0;
        font-size: 13.5px;
        line-height: 1.85;
        color: var(--ink-soft);
      }

      .af-plan-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 10px;
      }

      .af-plan-card {
        position: relative;
        text-align: left;
        padding: 12px 12px 12px 42px;
        display: grid;
        gap: 4px;
        background: #fffdf6;
      }

      .af-plan-card i {
        position: absolute;
        left: 10px;
        top: 12px;
        font-family: var(--mono);
        font-style: normal;
        font-size: 15px;
        color: var(--amber);
      }

      .af-plan-card strong {
        font-size: 15px;
        letter-spacing: 0.08em;
      }

      .af-plan-card span {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.6;
      }

      .af-plan-card.af-on {
        border-color: var(--ink);
        border-width: 2px;
        background: #fff6e3;
        box-shadow: 4px 4px 0 rgba(180, 83, 9, 0.28);
      }

      .af-plan-card.af-on::after {
        content: "选用";
        position: absolute;
        right: 8px;
        top: 8px;
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.2em;
        color: #fff8ec;
        background: var(--amber);
        padding: 2px 6px;
      }

      .af-hangar {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .af-hangar-block {
        border-top: 1.5px solid var(--ink);
        padding-top: 8px;
        display: grid;
        gap: 8px;
        align-content: start;
      }

      .af-hangar-block.af-span-all {
        grid-column: 1 / -1;
      }

      .af-hangar-block h3 {
        margin: 0;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.24em;
        color: var(--muted);
      }

      .af-hangar-grid,
      .af-store-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 8px;
      }

      .af-spec-card {
        text-align: left;
        padding: 9px 10px;
        display: grid;
        gap: 3px;
        background: #fffdf6;
      }

      .af-spec-card strong {
        font-size: 13.5px;
      }

      .af-spec-card span {
        font-size: 11.5px;
        color: var(--muted);
        line-height: 1.55;
      }

      .af-spec-card em {
        font-family: var(--mono);
        font-style: normal;
        font-size: 11px;
        color: var(--amber);
      }

      .af-spec-card.af-on {
        border-color: var(--ink);
        border-width: 2px;
        background: #fff6e3;
      }

      .af-store-card {
        background: #fdf8ec;
      }

      .af-ledger {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--ink-soft);
        letter-spacing: 0.06em;
        border-top: 1px dotted var(--line);
        padding-top: 6px;
      }

      .af-record-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 6px;
      }

      .af-record-chip {
        border: 1px solid var(--line);
        background: #fffdf6;
        padding: 6px 9px;
        font-size: 12px;
        display: grid;
        gap: 2px;
      }

      .af-record-chip b {
        font-size: 12px;
        letter-spacing: 0.04em;
      }

      .af-record-chip.af-settled {
        background: #fff6e3;
        border-color: var(--amber);
      }

      .af-io {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .af-io button {
        padding: 7px 14px;
        font-size: 12px;
      }

      .af-key {
        justify-self: center;
        min-width: 260px;
        padding: 13px 26px;
        font-size: 15px;
        letter-spacing: 0.3em;
        background: var(--ink);
        color: #f6efdf;
        border: 2px solid var(--ink);
        box-shadow: 5px 5px 0 var(--amber);
      }

      .af-key:hover {
        background: #17304f;
        color: #fff8ec;
      }

      .af-refit-panel {
        width: min(760px, 100%);
        padding: 20px;
        display: grid;
        gap: 14px;
      }

      .af-refit-panel h2 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0.12em;
        border-bottom: 2px solid var(--ink);
        padding-bottom: 8px;
      }

      .af-refit-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 10px;
      }

      .af-refit-card {
        text-align: left;
        padding: 12px;
        display: grid;
        gap: 5px;
        background: #fffdf6;
      }

      .af-refit-card strong {
        font-size: 14.5px;
      }

      .af-refit-card span {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.6;
      }

      @media (max-width: 860px) {
        .af-margin {
          display: none;
        }
        .af-console {
          left: 50%;
          bottom: calc(10px + env(safe-area-inset-bottom, 0px));
          transform: translateX(-50%);
        }
        .af-stick {
          display: block;
        }
        .af-device-btn,
        .af-fire-btn {
          display: grid;
        }
        .af-plan-grid,
        .af-hangar {
          grid-template-columns: 1fr;
        }
        .af-record-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .af-nameplate {
          width: calc(100vw - 24px);
        }
        .af-gauges {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }
      }

      @media (max-width: 520px) {
        .af-nameplate {
          padding: 8px 10px;
        }
        .af-gauge-value {
          font-size: 16px;
        }
        .af-cover {
          padding: 14px;
        }
        .af-cover h2 {
          font-size: 21px;
        }
        .af-refit-panel {
          padding: 14px;
        }
        .af-note {
          bottom: calc(88px + env(safe-area-inset-bottom, 0px));
          min-width: min(300px, calc(100vw - 28px));
        }
      }
    </style>
  </head>
  <body>
    <canvas id="afStage" aria-label="铁砧要塞作业区"></canvas>

    <div class="af-stick" id="afStick" aria-label="行进摇杆">
      <div class="af-stick-base"></div>
      <div class="af-stick-nub" id="afStickNub"></div>
    </div>

    <div class="af-draft">
      <section class="af-nameplate af-plate">
        <h1>铁砧要塞 <b>蓝图纪元 V3</b></h1>
        <div class="af-gauges">
          <div class="af-gauge">
            <div class="af-gauge-label">轮次</div>
            <div class="af-gauge-value" id="afWave">1</div>
          </div>
          <div class="af-gauge">
            <div class="af-gauge-label">积分</div>
            <div class="af-gauge-value" id="afScore">0</div>
          </div>
          <div class="af-gauge">
            <div class="af-gauge-label">峰值</div>
            <div class="af-gauge-value" id="afBest">0</div>
          </div>
          <div class="af-gauge">
            <div class="af-gauge-label">敌目标</div>
            <div class="af-gauge-value" id="afHostiles">0</div>
          </div>
          <div class="af-gauge">
            <div class="af-gauge-label">钢板</div>
            <div class="af-gauge-value" id="afPlating">100</div>
          </div>
        </div>
        <div class="af-bars">
          <div class="af-bar">
            <span id="afHullBar" style="width: 100%"></span>
          </div>
          <div class="af-bar af-warm">
            <span id="afLoadBar" style="width: 100%"></span>
          </div>
        </div>
      </section>

      <section class="af-margin af-plate">
        <h2>图版状态</h2>
        <div class="af-margin-list">
          <div class="af-margin-row">
            <span>弹型</span><strong id="afShell">制式弹</strong>
          </div>
          <div class="af-margin-row">
            <span>跳弹</span><strong id="afRicochet">1</strong>
          </div>
          <div class="af-margin-row">
            <span>图纸</span><strong id="afModules">0</strong>
          </div>
          <div class="af-margin-row">
            <span>机能</span><strong id="afDevice">磁涌冲击</strong>
          </div>
          <div class="af-margin-row">
            <span>任务</span><strong id="afObjective">肃清敌军</strong>
          </div>
          <div class="af-margin-row">
            <span>操控</span><strong>WASD / 指针</strong>
          </div>
        </div>
      </section>

      <div class="af-console">
        <button class="af-stamp-btn" id="afHoldBtn" title="搁置">Ⅱ</button>
        <button class="af-stamp-btn" id="afResetBtn" title="重新开局">↻</button>
        <button class="af-stamp-btn af-auto" id="afAutoBtn" title="自动击发：关">
          自动
        </button>
      </div>

      <button class="af-device-btn" id="afDeviceBtn" title="机能">✦</button>
      <button class="af-fire-btn" id="afFireBtn" title="击发">●</button>
    </div>

    <div class="af-note af-plate" id="afNote">第 1 轮</div>

    <div class="af-curtain" id="afCurtain">
      <section class="af-cover af-plate">
        <div class="af-cover-head">
          <p class="af-cover-kicker">ANVIL FORTRESS · BLUEPRINT ERA V3</p>
          <h2 id="afCurtainTitle">铁砧要塞：蓝图纪元 V3</h2>
        </div>
        <p id="afCurtainText">
          驾驶一门炮塔独立转向的主战战车，穿行于可拆解的街区块区；借助跳弹、背侧弱点与轮次整备强化，逐台击穿来犯敌军。首次进入请选定车体与主炮，随后开工建造。
        </p>
        <div class="af-plan-grid" id="afPlanGrid">
          <button class="af-plan-card af-on" data-af-mode="campaign">
            <i>01</i><strong>基准推进</strong>
            <span>八轮标准流程，节奏平稳，末轮对阵重型巨械。</span>
          </button>
          <button class="af-plan-card" data-af-mode="siege">
            <i>02</i><strong>据点固守</strong>
            <span>敌军密集，油桶与掩体成群，嗜好连环爆震者的选择。</span>
          </button>
          <button class="af-plan-card" data-af-mode="duel">
            <i>03</i><strong>斩首行动</strong>
            <span>敌军稀疏而强悍，弱点瞄准与走位决定生死。</span>
          </button>
          <button class="af-plan-card" data-af-mode="arena">
            <i>04</i><strong>限时抢分</strong>
            <span>十六车持续重回战场，拾取图纸自动装机，限时计分。</span>
          </button>
          <button class="af-plan-card" data-af-mode="elimination">
            <i>05</i><strong>淘汰赛制</strong>
            <span>十六车一命淘汰，拾取图纸强化，最终存者居首。</span>
          </button>
          <button class="af-plan-card" data-af-mode="storm">
            <i>06</i><strong>骤雨攻势</strong>
            <span>十轮高压行动，空袭与补给频发，巨械展露第二形态。</span>
          </button>
          <button class="af-plan-card" data-af-mode="bossRush">
            <i>07</i><strong>巨械连斩</strong>
            <span>五台巨械接连压境，各场更换护卫并强化阶段机制。</span>
          </button>
          <button class="af-plan-card" data-af-mode="endless">
            <i>08</i><strong>无限试制</strong>
            <span>轮次无限攀升，每八轮降临重型巨械，检验构筑极限。</span>
          </button>
        </div>
        <div class="af-hangar">
          <section class="af-hangar-block">
            <h3>车体选型</h3>

                mastery: {

                  cannon: value.mastery?.cannon || {},
                },
                loadout: { ...base.loadout, ...(value.loadout || {}) },
                best: Math.max(base.best, value.best || 0),
              };

          } catch (error) {}
          return base;

        function saveHash(text) {
          let hash = 2166136261;
          for (let i = 0; i < text.length; i++) {
            hash ^= text.charCodeAt(i);
            hash = Math.imul(hash, 16777619);
          }
          return (hash >>> 0).toString(36);

          const bytes = new TextEncoder().encode(json);
          let binary = "";
          bytes.forEach((byte) => (binary += String.fromCharCode(byte)));
          const payload = btoa(binary);
          return `NTA3.${payload}.${saveHash(payload)}`;
        }

        function decodeGarageSave(code) {
          const [prefix, payload, checksum] = String(code || "")
            .trim()
            .split(".");
          if (prefix !== "NTA3" || !payload || saveHash(payload) !== checksum)
            throw new Error("图纸码校验失败");
          const binary = atob(payload);
          const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
          const parsed = JSON.parse(new TextDecoder().decode(bytes));
          if (parsed.game !== "neon-tank" || !parsed.data)
            throw new Error("存档与当前图版不匹配");
          localStorage.setItem(TANK_SAVE_KEY, JSON.stringify(parsed.data));
          garageSave = loadGarage();
          selectedMode = MODES[garageSave.loadout.mode]
            ? garageSave.loadout.mode
            : "campaign";
          selectedChassis = CHASSIS[garageSave.loadout.chassis]
            ? garageSave.loadout.chassis
            : "vanguard";
          selectedCannon = CANNONS[garageSave.loadout.cannon]
            ? garageSave.loadout.cannon
            : "cannon";
          modeButtons.forEach((button) =>
            button.classList.toggle(
              "af-on",
              button.dataset.afMode === selectedMode,
            ),
          );
          saveGarage();
          renderGarage();
        }

        function settleMilestones() {
          let bonus = 0;
          for (const item of CAREER_MILESTONES) {
            if (!garageSave.milestones[item.id] && item.done(garageSave)) {
              garageSave.milestones[item.id] = true;
              garageSave.credits += item.reward;
              bonus += item.reward;
            }
          }
          return bonus;
        }

        function renderGarage() {
          chassisGrid.innerHTML = Object.entries(CHASSIS)
            .map(
              ([key, item]) =>
                `<button class="af-spec-card ${selectedChassis === key ? "af-on" : ""}" data-af-chassis="${key}"><strong>${item.name}</strong><span>${item.text}</span></button>`,
            )
            .join("");
          cannonGrid.innerHTML = Object.entries(CANNONS)
            .map(
              ([key, item]) =>
                `<button class="af-spec-card ${selectedCannon === key ? "af-on" : ""}" data-af-cannon="${key}"><strong>${item.name}</strong><span>${item.text}</span></button>`,
            )
            .join("");
          armoryGrid.innerHTML = Object.entries(ARMORY)
            .map(([key, item]) => {
              const level = garageSave.tech[key] || 0;
              const cost = item.cost(level);
              const maxed = level >= item.max;
              return `<button class="af-spec-card af-store-card" data-af-armory="${key}" ${maxed || garageSave.credits < cost ? "disabled" : ""}><strong>${item.name} Lv.${level}</strong><span>${item.text}</span><em>${maxed ? "已封顶" : `功绩 ${cost}`}</em></button>`;
            })
            .join("");
          garageMeta.textContent = `功绩 ${garageSave.credits} · 总击毁 ${garageSave.totalKills || 0} · 巨械 ${garageSave.bosses || 0}`;
          careerGrid.innerHTML = [
            ...CAREER_MILESTONES.map((item) => {
              const done = !!garageSave.milestones[item.id];
              return `<div class="af-record-chip ${done ? "af-settled" : ""}"><b>${done ? "✓ " : ""}${item.name}</b>${item.text} · ${done ? "已领取" : `功绩 ${item.reward}`}</div>`;
            }),
            `<div class="af-record-chip"><b>服役胜场</b>${garageSave.wins || 0} 胜</div>`,
            `<div class="af-record-chip"><b>型制完成</b>${Object.values(garageSave.records || {}).filter((r) => r.wins > 0).length}/${Object.keys(MODES).length}</div>`,
            `<div class="af-record-chip"><b>车体熟练</b>${garageSave.mastery?.chassis?.[selectedChassis] || 0} 次部署</div>`,
            `<div class="af-record-chip"><b>主炮熟练</b>${garageSave.mastery?.cannon?.[selectedCannon] || 0} 次部署</div>`,
          ].join("");
        }

        function buyArmory(key) {
          const item = ARMORY[key];
          const level = garageSave.tech[key] || 0;
          const cost = item.cost(level);
          if (level >= item.max || garageSave.credits < cost) return;
          garageSave.credits -= cost;
          garageSave.tech[key] = level + 1;
          saveGarage();
          renderGarage();
        }

        function resize() {
          dpr = Math.min(2, window.devicePixelRatio || 1);
          view.w = window.innerWidth;
          view.h = window.innerHeight;
          canvas.width = Math.floor(view.w * dpr);
          canvas.height = Math.floor(view.h * dpr);
          canvas.style.width = `${view.w}px`;
          canvas.style.height = `${view.h}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          updatePointerWorld();
        }

        function rand(min, max) {
          return min + Math.random() * (max - min);
        }

        function clamp(value, min, max) {
          return Math.max(min, Math.min(max, value));
        }

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function angleLerp(a, b, t) {
          let diff = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
          return a + diff * t;
        }

        function distSq(a, b) {
          const dx = a.x - b.x;
          const dy = a.y - b.y;
          return dx * dx + dy * dy;
        }

        function distance(a, b) {
          return Math.hypot(a.x - b.x, a.y - b.y);
        }

        function norm(dx, dy) {
          const length = Math.hypot(dx, dy) || 1;
          return { x: dx / length, y: dy / length };
        }

        function updatePointerWorld() {
          const zoom = getZoom();
          pointer.worldX = camera.x + (pointer.x - view.w / 2) / zoom;
          pointer.worldY = camera.y + (pointer.y - view.h / 2) / zoom;
        }

        function screenToWorld(x, y) {
          const zoom = getZoom();
          return {
            x: camera.x + (x - view.w / 2) / zoom,
            y: camera.y + (y - view.h / 2) / zoom,
          };
        }

        function getZoom() {
          return clamp(Math.min(view.w, view.h) / 850, 0.62, 1.08);
        }

        function modeConfig() {
          return MODES[game.mode || selectedMode] || MODES.campaign;
        }

        function isCompetitiveMode() {
          return Boolean(modeConfig().competitive);
        }

        function isRespawnMode() {
          return Boolean(modeConfig().respawn);
        }

        function isEliminationMode() {
          return Boolean(modeConfig().elimination);
        }

        function showToast(text) {
          toast.textContent = text;
          toast.classList.add("af-show");
          toastTimer = 1.8;
        }

        function makePlayer() {
          const tank = {
            x: WORLD / 2,
            y: WORLD / 2,
            vx: 0,
            vy: 0,
            bodyAngle: -Math.PI / 2,
            turretAngle: -Math.PI / 2,
            size: PLAYER_SIZE,
            hp: 100,
            maxHp: 100,
            speed: 190,
            reload: 0.42,
            reloadLeft: 0,
            damage: 28,
            bulletSpeed: 560,
            bounces: 1,
            pierce: 0,
            scatter: 0,
            drones: 0,
            skillCooldown: 11,
            skillLeft: 0,
            skillMines: 0,
            shieldUntil: 0,
            shieldBonus: 0,
            turretTurn: 9,
            shellName: "制式弹",
            pickupMagnet: 190,
            scrap: 0,
            kills: 0,
            deaths: 0,
            parts: [],
            frontArmor: 0,
            respawnLeft: 0,
            blast: 0,
            chassis: selectedChassis,
            cannon: selectedCannon,
          };
          const chassis = CHASSIS[selectedChassis];
          const cannon = CANNONS[selectedCannon];
          tank.maxHp = Math.round(
            (tank.maxHp + (garageSave.tech.armor || 0) * 4) * chassis.hp,
          );
          tank.hp = tank.maxHp;
          tank.speed *= chassis.speed;
          tank.reload *= chassis.reload * cannon.reload;
          tank.reload *= 1 - (garageSave.tech.cooling || 0) * 0.02;
          tank.skillCooldown *= 1 - (garageSave.tech.cooling || 0) * 0.02;
          tank.speed *= 1 + (garageSave.tech.mobility || 0) * 0.02;
          tank.damage *=
            cannon.damage * (1 + (garageSave.tech.power || 0) * 0.04);
          tank.bulletSpeed *= cannon.speed;
          tank.bounces = cannon.bounce;
          tank.pierce += cannon.pierce || 0;
          tank.scatter += cannon.scatter || 0;
          tank.blast = (cannon.blast || 0) * (chassis.blast || 1);
          tank.shellName = cannon.shell || "制式弹";
          tank.frontArmor = chassis.front || 0;
          tank.drones = chassis.drone || 0;
          tank.skillMines = chassis.mines || 0;
          tank.pickupMagnet *= chassis.magnet || 1;
          return tank;
        }

        function newGame() {
          const config = MODES[selectedMode];
          game = {
            mode: selectedMode,
            wave: 1,
            maxWave: config.waves,
            score: 0,
            best: garageSave.best || 0,
            state: "playing",
            waveClearTimer: 0,
            arenaTime: config.time || 0,
            pickupTimer: 0,
            eventTimer: config.storm ? 12 : 28,
            eventCount: 0,
            eliminatedRank: 0,
            result: "",
          };
          player = makePlayer();
          bullets = [];
          mines = [];
          explosions = [];
          particles = [];
          floaters = [];
          parts = [];
          drones = [];
          airstrikes = [];
          generateArena();
          if (config.competitive) startCompetitiveMatch();
          else spawnWave();
          overlay.classList.add("af-veiled");
          upgradeOverlay.classList.add("af-veiled");
          showToast(
            config.competitive
              ? `${config.name} 开工`
              : `${MODES[selectedMode].name} · 第 1 轮`,
          );
          updateHud(true);
        }

        function generateArena() {
          walls = [];
          barrels = [];
          const center = { x: WORLD / 2, y: WORLD / 2 };
          const config = MODES[selectedMode];
          const addWall = (gx, gy, type, w = TILE, h = TILE) => {
            walls.push(
              makeWall(center.x + gx * TILE, center.y + gy * TILE, w, h, type),
            );
          };
          const mirrorWall = (gx, gy, type, w = TILE, h = TILE) => {
            const points = [
              [gx, gy],
              [-gx, gy],
              [gx, -gy],
              [-gx, -gy],
            ];
            const seen = new Set();
            for (const [x, y] of points) {
              const key = `${x},${y}`;
              if (!seen.has(key)) {
                seen.add(key);
                addWall(x, y, type, w, h);
              }
            }
          };
          const addBarrel = (gx, gy) => {
            barrels.push({
              x: center.x + gx * TILE,
              y: center.y + gy * TILE,
              r: 20,
              hp: 24,
              alive: true,
            });
          };
          const mirrorBarrel = (gx, gy) => {
            const points = [
              [gx, gy],
              [-gx, gy],
              [gx, -gy],
              [-gx, -gy],
            ];
            const seen = new Set();
            for (const [x, y] of points) {
              const key = `${x},${y}`;
              if (!seen.has(key)) {
                seen.add(key);
                addBarrel(x, y);
              }
            }
          };

          for (let i = -11; i <= 11; i++) {
            if (Math.abs(i) % 4 !== 1) {
              addWall(i, -14, "steel");
              addWall(i, 14, "steel");
              addWall(-14, i, "steel");
              addWall(14, i, "steel");
            }
          }

          for (const x of [-7, -6, -5, 5, 6, 7]) {
            addWall(x, -4, "brick");
            addWall(x, 4, "brick");
            addWall(-4, x, "brick");
            addWall(4, x, "brick");
          }
          for (const x of [-11, -10, 10, 11]) {
            mirrorWall(x, 0, "steel");
            mirrorWall(0, x, "steel");
          }
          for (const p of [
            [-9, -7],
            [-8, -7],
            [-7, -7],
            [-9, -6],
            [-6, -9],
            [-6, -8],
            [-6, -7],
          ]) {
            mirrorWall(p[0], p[1], "brick");
          }
          for (const p of [
            [-3, -9],
            [-2, -9],
            [2, -9],
            [3, -9],
            [-9, -3],
            [-9, -2],
            [-9, 2],
            [-9, 3],
          ]) {
            mirrorWall(p[0], p[1], "brick");
          }
          for (const p of [
            [-2, -2],
            [2, -2],
            [-2, 2],
            [2, 2],
          ]) {
            addWall(p[0], p[1], "steel");
          }

          const extraBrick = config.competitive ? 18 : 28;
          for (let i = 0; i < extraBrick; i++) {
            const gx = Math.round(rand(-12, 12));
            const gy = Math.round(rand(-12, 12));
            if (Math.abs(gx) < 3 && Math.abs(gy) < 3) continue;
            if (gx % 4 === 0 || gy % 4 === 0) continue;
            addWall(gx, gy, "brick");
          }
          const barrelCount = Math.round(
            (config.competitive ? 8 : 12) * config.barrelScale,
          );
          for (let i = 0; i < barrelCount; i++) {
            const gx = Math.round(rand(-11, 11));
            const gy = Math.round(rand(-11, 11));
            if (Math.abs(gx) < 4 && Math.abs(gy) < 4) continue;
            mirrorBarrel(gx, gy);
            i += 3;
          }
        }

        function makeWall(x, y, w, h, type) {
          return {
            x,
            y,
            w: w - 10,
            h: h - 10,
            type,
            hp: type === "steel" ? 9999 : 52,
            maxHp: type === "steel" ? 9999 : 52,
          };
        }

        function spawnWave() {
          enemies = [];
          bullets = bullets.filter((bullet) => bullet.owner === "player");
          mines = [];
          const config = MODES[selectedMode];
          const bossWave =
            config.bossRush ||
            (config.endless && game.wave % 8 === 0) ||
            game.wave === game.maxWave;
          if (bossWave) {
            const boss = spawnEnemy("boss", WORLD / 2, 280, game.wave);
            if (config.bossRush) boss.name = `巨械堡垒 MK-${game.wave}`;
            for (let i = 0; i < (config.bossRush ? 3 + game.wave : 5); i++)
              spawnEnemy(i % 2 ? "heavy" : "rocket", 0, 0, game.wave);
          } else {
            const count = Math.round(
              (5 + game.wave * 1.35) * config.enemyScale,
            );
            for (let i = 0; i < count; i++) {
              let type = "scout";
              if (game.wave > 1 && Math.random() < 0.3) type = "heavy";
              if (game.wave > 2 && Math.random() < 0.25) type = "rocket";
              if (game.wave > 3 && Math.random() < 0.18) type = "miner";
              if (game.wave > 4 && Math.random() < 0.16) type = "shield";
              if (game.wave > 5 && Math.random() < 0.13) type = "artillery";
              if (game.wave > 6 && Math.random() < 0.12) type = "repair";
              spawnEnemy(type, 0, 0, game.wave);
            }
          }
          objectiveValue.textContent = bossWave ? "击毁巨械" : "肃清敌军";
        }

        function startCompetitiveMatch() {
          const config = modeConfig();
          enemies = [];
          bullets = [];
          mines = [];
          parts = [];
          player.x = WORLD / 2;
          player.y = WORLD / 2;
          player.hp = player.maxHp;
          player.score = 0;
          player.scrap = 0;
          player.parts = [];
          player.kills = 0;
          player.deaths = 0;
          for (let i = 0; i < config.bots; i++) {
            const type =
              i % 5 === 0
                ? "heavy"
                : i % 4 === 0
                  ? "rocket"
                  : i % 3 === 0
                    ? "miner"
                    : "scout";
            const bot = spawnEnemy(type, 0, 0, 3);
            bot.name = BOT_NAMES[i] || `AI-${i + 1}`;
            bot.arena = true;
            bot.points = 0;
            bot.scrap = 0;
            bot.kills = 0;
            bot.deaths = 0;
            bot.parts = [];
          }
          spawnInitialPickups(config.elimination ? 18 : 22);
          objectiveValue.textContent = config.elimination
            ? "最终存者居首"
            : "限时抢分";
        }

        function spawnEnemy(type, x, y, wave) {
          const spec = ENEMY_TYPES[type];
          let point = x && y ? { x, y } : randomSpawnPoint();
          const elite =
            type !== "boss" &&
            Math.random() <
              Math.min(0.24, 0.035 * wave * MODES[selectedMode].eliteScale);
          const hpScale = (1 + wave * 0.12) * (elite ? 1.55 : 1);
          const enemy = {
            id: Math.random(),
            type,
            name: elite ? `强化${spec.name}` : spec.name,
            x: point.x,
            y: point.y,
            vx: 0,
            vy: 0,
            bodyAngle: rand(0, Math.PI * 2),
            turretAngle: rand(0, Math.PI * 2),
            size: spec.size * (elite ? 1.1 : 1),
            hp: spec.hp * hpScale,
            maxHp: spec.hp * hpScale,
            speed: spec.speed * (elite ? 1.08 : 1),
            reload: spec.reload * (elite ? 0.82 : 1),
            reloadLeft: rand(0.2, 1.4),
            damage: spec.damage * (elite ? 1.22 : 1),
            score: spec.score * (elite ? 1.6 : 1),
            color: elite ? "#ffffff" : spec.color,
            aiTime: rand(0, 2),
            strafe: Math.random() < 0.5 ? 1 : -1,
            frontArmor: spec.frontArmor || 0,
            artillery: Boolean(spec.artillery),
            repair: Boolean(spec.repair),
            repairTimer: rand(2, 4),
            phaseTwo: false,
            elite,
          };
          enemies.push(enemy);
          return enemy;
        }

        function randomSpawnPoint() {
          for (let i = 0; i < 300; i++) {
            const side = Math.floor(Math.random() * 4);
            const margin = 160;
            const point = {
              x:
                side === 0
                  ? margin
                  : side === 1
                    ? WORLD - margin
                    : rand(margin, WORLD - margin),
              y:
                side === 2
                  ? margin
                  : side === 3
                    ? WORLD - margin
                    : rand(margin, WORLD - margin),
            };
            if (
              distance(point, player) > 660 &&
              !circleHitsWall(point.x, point.y, 34)
            )
              return point;
          }
          return { x: rand(180, WORLD - 180), y: rand(180, WORLD - 180) };
        }

        function circleHitsWall(x, y, r) {
          for (const wall of walls) {
            if (circleRectHit(x, y, r, wall)) return true;
          }
          return false;
        }

        function circleRectHit(cx, cy, r, rect) {
          const closestX = clamp(cx, rect.x - rect.w / 2, rect.x + rect.w / 2);
          const closestY = clamp(cy, rect.y - rect.h / 2, rect.y + rect.h / 2);
          const dx = cx - closestX;
          const dy = cy - closestY;
          return dx * dx + dy * dy <= r * r;
        }

        function moveCircle(entity, dx, dy, radius) {
          let nx = clamp(entity.x + dx, radius, WORLD - radius);
          let ny = entity.y;
          if (!circleHitsWall(nx, ny, radius)) {
            entity.x = nx;
          } else {
            entity.vx *= -0.12;
          }
          nx = entity.x;
          ny = clamp(entity.y + dy, radius, WORLD - radius);
          if (!circleHitsWall(nx, ny, radius)) {
            entity.y = ny;
          } else {
            entity.vy *= -0.12;
          }
        }

        function fireBullet(owner, x, y, angle, options) {
          const speed = options.speed || player.bulletSpeed;
          const size = options.size || 6;
          bullets.push({
            owner,
            x,
            y,
            px: x,
            py: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            angle,
            r: size,
            damage: options.damage,
            bounces: options.bounces,
            pierce: options.pierce || 0,
            life: options.life || 2.7,
            color: options.color || "#1d4e89",
            blast: options.blast || 0,
            ownerTank: options.ownerTank || null,
          });
        }

        function playerShoot() {
          if (game.state !== "playing" || player.reloadLeft > 0) return;
          const muzzle = player.size * 0.72;
          fireBullet(
            "player",
            player.x + Math.cos(player.turretAngle) * muzzle,
            player.y + Math.sin(player.turretAngle) * muzzle,
            player.turretAngle,
            {
              damage: player.damage,
              bounces: player.bounces,
              pierce: player.pierce,
              speed: player.bulletSpeed,
              color: player.scatter ? "#b45309" : "#1d4e89",
              size: 6,
              blast: player.blast,
              ownerTank: player,
            },
          );
          for (let i = 0; i < player.scatter; i++) {
            const spread = 0.16 + i * 0.04;
            fireBullet(
              "player",
              player.x,
              player.y,
              player.turretAngle - spread,
              {
                damage: player.damage * 0.48,
                bounces: Math.max(0, player.bounces - 1),
                speed: player.bulletSpeed * 0.92,
                color: "#b45309",
                size: 4.8,
                life: 1.7,
                ownerTank: player,
              },
            );
            fireBullet(
              "player",
              player.x,
              player.y,
              player.turretAngle + spread,
              {
                damage: player.damage * 0.48,
                bounces: Math.max(0, player.bounces - 1),
                speed: player.bulletSpeed * 0.92,
                color: "#b45309",
                size: 4.8,
                life: 1.7,
                ownerTank: player,
              },
            );
          }
          player.reloadLeft = player.reload;
          shake(3);
        }

        function useSkill() {
          if (game.state !== "playing" || player.skillLeft > 0) return;
          player.skillLeft = player.skillCooldown;
          player.shieldUntil =
            performance.now() / 1000 + 1.15 + player.shieldBonus;
          if (player.chassis === "interceptor") {
            player.overdriveUntil = performance.now() / 1000 + 4.5;
            player.reloadLeft = 0;
            showToast("迅驰超频启动");
          } else if (player.chassis === "bastion") {
            player.shieldUntil += 2.4;
            healPlayer(18);
            showToast("重垒屏障展开");
          } else if (player.chassis === "engineer") {
            healPlayer(24);
            player.skillMines = Math.max(6, player.skillMines);
            showToast("工程驰援释放");
          } else if (player.chassis === "specter") {
            player.shieldUntil += 1.8;
            const dx = Math.cos(player.bodyAngle) * 150;
            const dy = Math.sin(player.bodyAngle) * 150;
            moveCircle(player, dx, dy, player.size * 0.45);
            player.reloadLeft = 0;
            showToast("幽影相位突进");
          } else if (player.chassis === "juggernaut") {
            player.shieldUntil += 1.1;
            healPlayer(12);
            explosions.push({
              x: player.x,
              y: player.y,
              r: 28,
              max: 520,
              life: 0.5,
              damage: 86,
              owner: "player",
              color: "#b45309",
              ownerTank: player,
            });
            showToast("破阵震荡释放");
          }
          explosions.push({
            x: player.x,
            y: player.y,
            r: 24,
            max: 360,
            life: 0.42,
            damage: 42,
            owner: "player",
            color: "#1d4e89",
            ownerTank: player,
          });
          for (const enemy of [...enemies]) {
            const d = distance(player, enemy);
            if (d < 360) {
              enemy.reloadLeft += 1.2;
              damageEnemy(enemy, 34 * (1 - d / 480), "front", player);
              addFloater("磁扰", enemy.x, enemy.y - 18, "#1d4e89");
            }
          }
          for (let i = 0; i < player.skillMines; i++) {
            const a = (Math.PI * 2 * i) / player.skillMines;
            mines.push({
              owner: "player",
              x: player.x + Math.cos(a) * 92,
              y: player.y + Math.sin(a) * 92,
              r: 12,
              arm: 0.55,
              life: 9,
              ownerTank: player,
            });
          }
          burst(player.x, player.y, "#1d4e89", 34);
          if (player.chassis === "vanguard") showToast("磁涌冲击已释放");
        }

        function update(dt, now) {
          if (game.state !== "playing") {
            updateEffects(dt);
            return;
          }
          player.reloadLeft = Math.max(0, player.reloadLeft - dt);
          player.skillLeft = Math.max(0, player.skillLeft - dt);
          updatePlayer(dt);
          updateDrones(dt);
          updateEnemies(dt);
          updateParts(dt);
          updateBattleEvents(dt);
          updateBullets(dt);
          updateMines(dt);
          updateExplosions(dt);
          updateEffects(dt);
          updateCamera(dt);
          if (isCompetitiveMode()) checkCompetitive(dt);
          else checkWave(dt);
          hudTimer -= dt;
          if (hudTimer <= 0) {
            updateHud(false);
            hudTimer = 0.08;
          }
          if (toastTimer > 0) {
            toastTimer -= dt;
            if (toastTimer <= 0) toast.classList.remove("af-show");
          }
          if (player.hp <= 0) {
            if (isRespawnMode()) respawnPlayer();
            else endGame(false);
          }
        }

        function updatePlayer(dt) {
          let ax = 0;
          let ay = 0;
          if (keys.has("KeyW") || keys.has("ArrowUp")) ay -= 1;
          if (keys.has("KeyS") || keys.has("ArrowDown")) ay += 1;
          if (keys.has("KeyA") || keys.has("ArrowLeft")) ax -= 1;
          if (keys.has("KeyD") || keys.has("ArrowRight")) ax += 1;
          if (touchMove.active) {
            ax += touchMove.dx;
            ay += touchMove.dy;
          }
          const input = norm(ax, ay);
          const moving = Math.hypot(ax, ay) > 0.04;
          const overdrive =
            (player.overdriveUntil || 0) > performance.now() / 1000 ? 1.55 : 1;
          const targetSpeed = moving ? player.speed * overdrive : 0;
          player.vx = lerp(
            player.vx,
            input.x * targetSpeed,
            1 - Math.pow(0.001, dt),
          );
          player.vy = lerp(
            player.vy,
            input.y * targetSpeed,
            1 - Math.pow(0.001, dt),
          );
          if (moving)
            player.bodyAngle = angleLerp(
              player.bodyAngle,
              Math.atan2(input.y, input.x),
              dt * 9,
            );
          updatePointerWorld();
          const turretTarget = Math.atan2(
            pointer.worldY - player.y,
            pointer.worldX - player.x,
          );
          player.turretAngle = angleLerp(
            player.turretAngle,
            turretTarget,
            dt * player.turretTurn,
          );
          moveCircle(
            player,
            player.vx * dt,
            player.vy * dt,
            player.size * 0.48,
          );
          if (pointer.down || autoFire) playerShoot();
        }

        function updateDrones(dt) {
          while (drones.length < player.drones) {
            drones.push({
              angle: rand(0, Math.PI * 2),
              reload: rand(0, 0.5),
              x: player.x,
              y: player.y,
            });
          }
          for (let i = 0; i < drones.length; i++) {
            const drone = drones[i];
            drone.angle += dt * (1.6 + i * 0.18);
            drone.x = player.x + Math.cos(drone.angle) * 82;
            drone.y = player.y + Math.sin(drone.angle) * 82;
            drone.reload -= dt;
            if (drone.reload <= 0 && enemies.length) {
              const target = enemies.reduce((best, enemy) => {
                const score = enemy.hp + distance(drone, enemy) * 0.18;
                return !best || score < best.score ? { enemy, score } : best;
              }, null).enemy;
              if (distance(drone, target) < 760) {
                const angle = Math.atan2(
                  target.y - drone.y,
                  target.x - drone.x,
                );
                fireBullet("player", drone.x, drone.y, angle, {
                  damage: player.damage * 0.36,
                  bounces: 0,
                  speed: player.bulletSpeed * 1.12,
                  color: "#3f7d5a",
                  size: 4,
                  life: 1.2,
                  ownerTank: player,
                });
                drone.reload = 0.62;
              }
            }
          }
        }

        function updateParts(dt) {
          if (isCompetitiveMode()) {
            game.pickupTimer -= dt;
            const targetCount = isEliminationMode() ? 20 : 26;
            if (game.pickupTimer <= 0 && parts.length < targetCount) {
              spawnRandomPickup();
              game.pickupTimer = isEliminationMode()
                ? rand(7, 11)
                : rand(4.5, 7);
            }
          }
          for (let i = parts.length - 1; i >= 0; i--) {
            const part = parts[i];
            part.life -= dt;
            part.spin += dt * 3;
            const playerDistance = distance(player, part);
            if (player.hp > 0 && playerDistance < player.pickupMagnet) {
              const pull =
                clamp(1 - playerDistance / player.pickupMagnet, 0.08, 1) *
                520 *
                dt;
              const n = norm(player.x - part.x, player.y - part.y);
              part.x += n.x * pull;
              part.y += n.y * pull;
            }
            if (distance(player, part) < 42 && player.hp > 0) {
              collectPickup(player, part);
              parts.splice(i, 1);
              continue;
            }
            const bot = isCompetitiveMode()
              ? enemies.find((enemy) => distance(enemy, part) < 40)
              : null;
            if (bot) {
              collectPickup(bot, part);
              parts.splice(i, 1);
              continue;
            }
            if (part.life <= 0) parts.splice(i, 1);
          }
        }

        function updateBattleEvents(dt) {
          if (!isCompetitiveMode()) {
            game.eventTimer -= dt;
            if (game.eventTimer <= 0) {
              game.eventCount += 1;
              const barrage = game.eventCount % 2 === 0 || modeConfig().storm;
              if (barrage) {
                const count = modeConfig().storm ? 5 : 3;
                for (let i = 0; i < count; i++) {
                  airstrikes.push({
                    x: clamp(player.x + rand(-520, 520), 100, WORLD - 100),
                    y: clamp(player.y + rand(-420, 420), 100, WORLD - 100),
                    r: rand(72, 118),
                    warning: 1.7,
                    life: 2.2,
                    exploded: false,
                  });
                }
                showToast("空袭坐标已标注");
              } else {
                for (let i = 0; i < 4; i++)
                  parts.push(
                    makePickup(
                      clamp(player.x + rand(-240, 240), 80, WORLD - 80),
                      clamp(player.y + rand(-190, 190), 80, WORLD - 80),
                      i === 0 ? "module" : null,
                    ),
                  );
                showToast("补给点位已下发");
              }
              game.eventTimer = modeConfig().storm
                ? rand(15, 21)
                : rand(26, 36);
            }
          }
          for (const strike of airstrikes) {
            strike.warning -= dt;
            strike.life -= dt;
            if (strike.warning <= 0 && !strike.exploded) {
              strike.exploded = true;
              explosions.push({
                x: strike.x,
                y: strike.y,
                r: 20,
                max: strike.r * 1.45,
                life: 0.38,
                damage: 78,
                owner: "neutral",
                color: "#ff8b5f",
              });
              burst(strike.x, strike.y, "#ff8b5f", 34);
            }
          }
          airstrikes = airstrikes.filter((strike) => strike.life > 0);
        }

        function dropParts(x, y, count) {
          if (!isCompetitiveMode() && Math.random() > 0.35) return;
          for (let i = 0; i < count; i++) {
            const a = rand(0, Math.PI * 2);
            const r = rand(12, 54);
            parts.push(
              makePickup(
                x + Math.cos(a) * r,
                y + Math.sin(a) * r,
                i === 0 ? "module" : null,
              ),
            );
          }
        }

        function spawnInitialPickups(count) {
          for (let i = 0; i < count; i++)
            spawnRandomPickup(i % 3 === 0 ? "module" : null);
          game.pickupTimer = rand(4, 7);
        }

        function spawnRandomPickup(forcedKind) {
          for (let i = 0; i < 120; i++) {
            const point = {
              x: rand(180, WORLD - 180),
              y: rand(180, WORLD - 180),
            };
            if (
              distance(point, player) < 220 ||
              circleHitsWall(point.x, point.y, 26)
            )
              continue;
            parts.push(makePickup(point.x, point.y, forcedKind));
            return;
          }
        }

        function makePickup(x, y, forcedKind) {
          const roll = Math.random();
          const kind =
            forcedKind ||
            (roll < 0.58 ? "module" : roll < 0.8 ? "repair" : "shield");
          const module = kind === "module" ? randomPart() : null;
          return {
            x,
            y,
            kind,
            module,
            life: isCompetitiveMode() ? 34 : 18,
            spin: rand(0, Math.PI * 2),
            color:
              kind === "repair"
                ? "#3f7d5a"
                : kind === "shield"
                  ? "#1d4e89"
                  : "#b45309",
          };
        }

        function randomPart(target) {
          const pool =
            target && target !== player
              ? PARTS.filter((part) => part.id !== "drone-part")
              : PARTS;
          return pool[Math.floor(Math.random() * pool.length)];
        }

        function collectPickup(target, pickup) {
          if (pickup.kind === "repair") {
            target.hp = Math.min(target.maxHp, target.hp + 28);
            addFloater("抢修 +28", target.x, target.y - 36, "#3f7d5a");
            if (target === player) showToast("钢板修复");
            return;
          }
          if (pickup.kind === "shield") {
            target.shieldUntil = performance.now() / 1000 + 2.4;
            addFloater("屏障", target.x, target.y - 36, "#1d4e89");
            if (target === player) showToast("临时屏障启动");
            return;
          }
          const module =
            target !== player &&
            pickup.module &&
            pickup.module.id === "drone-part"
              ? randomPart(target)
              : pickup.module || randomPart(target);
          module.apply(target);
          target.parts = target.parts || [];
          target.parts.push(module.title);
          target.scrap = (target.scrap || 0) + 1;
          addFloater(
            module.title,
            target.x,
            target.y - 40,
            target === player ? "#b45309" : "#6d5ba8",
          );
          if (target === player) showToast(`自动装机：${module.title}`);
        }

        function updateEnemies(dt) {
          for (const enemy of enemies) {
            enemy.aiTime -= dt;
            if (enemy.repair) {
              enemy.repairTimer -= dt;
              if (enemy.repairTimer <= 0) {
                enemy.repairTimer = 4.2;
                for (const ally of enemies) {
                  if (ally !== enemy && distance(enemy, ally) < 260)
                    ally.hp = Math.min(
                      ally.maxHp,
                      ally.hp + 24 + game.wave * 3,
                    );
                }
                explosions.push({
                  x: enemy.x,
                  y: enemy.y,
                  r: 20,
                  max: 180,
                  life: 0.34,
                  damage: 0,
                  owner: "enemy",
                  color: "#4c8a6a",
                  visualOnly: true,
                });
              }
            }
            if (
              enemy.type === "boss" &&
              enemy.hp < enemy.maxHp * 0.5 &&
              !enemy.phaseTwo
            ) {
              enemy.phaseTwo = true;
              enemy.reload *= 0.68;
              enemy.speed *= 1.18;
              spawnEnemy("shield", 0, 0, game.wave);
              spawnEnemy("artillery", 0, 0, game.wave);
              showToast("巨械堡垒展开二阶段");
            }
            const target = chooseEnemyTarget(enemy);
            const desiredPart = isCompetitiveMode() ? nearestPart(enemy) : null;
            const blocked = target && !hasLineOfSight(enemy, target);
            if (blocked && (!enemy.waypoint || enemy.aiTime <= 0))
              enemy.waypoint = findFlankPoint(enemy, target);
            const pickupRange = enemy.hp < enemy.maxHp * 0.45 ? 760 : 560;
            const goal =
              desiredPart && distance(enemy, desiredPart) < pickupRange
                ? desiredPart
                : blocked && enemy.waypoint
                  ? enemy.waypoint
                  : target;
            const dx = goal.x - enemy.x;
            const dy = goal.y - enemy.y;
            const d = Math.hypot(dx, dy) || 1;
            const toGoal = { x: dx / d, y: dy / d };
            const ideal = enemy.artillery
              ? 720
              : enemy.type === "rocket"
                ? 620
                : enemy.type === "heavy" || enemy.type === "shield"
                  ? 360
                  : enemy.type === "boss"
                    ? 510
                    : 430;
            const close = d < ideal * 0.72;
            const far = d > ideal * 1.18;
            let mx = 0;
            let my = 0;
            if (desiredPart && goal === desiredPart) {
              mx += toGoal.x * 1.2;
              my += toGoal.y * 1.2;
            } else if (far) {
              mx += toGoal.x;
              my += toGoal.y;
            } else if (close) {
              mx -= toGoal.x;
              my -= toGoal.y;
            }
            mx += -toGoal.y * enemy.strafe * 0.55;
            my += toGoal.x * enemy.strafe * 0.55;
            const dodge = dodgeVector(enemy);
            mx += dodge.x;
            my += dodge.y;
            if (enemy.aiTime <= 0) {
              enemy.strafe *= Math.random() < 0.62 ? -1 : 1;
              enemy.aiTime = rand(0.8, 1.9);
            }
            const move = norm(mx, my);
            const speed =
              enemy.speed * (enemy.hp < enemy.maxHp * 0.35 ? 1.1 : 1);
            enemy.vx = lerp(enemy.vx, move.x * speed, 1 - Math.pow(0.005, dt));
            enemy.vy = lerp(enemy.vy, move.y * speed, 1 - Math.pow(0.005, dt));
            if (Math.hypot(enemy.vx, enemy.vy) > 12)
              enemy.bodyAngle = angleLerp(
                enemy.bodyAngle,
                Math.atan2(enemy.vy, enemy.vx),
                dt * 5,
              );
            const aimDx = target.x - enemy.x;
            const aimDy = target.y - enemy.y;
            enemy.turretAngle = angleLerp(
              enemy.turretAngle,
              Math.atan2(aimDy, aimDx),
              dt *
                (enemy.type === "heavy" || enemy.type === "shield" ? 3.4 : 5.2),
            );
            moveCircle(enemy, enemy.vx * dt, enemy.vy * dt, enemy.size * 0.48);
            enemy.reloadLeft -= dt;
            if (
              enemy.type === "miner" &&
              enemy.reloadLeft < enemy.reload * 0.28 &&
              Math.random() < dt * 0.65
            ) {
              mines.push({
                owner: "enemy",
                x: enemy.x - toGoal.x * 42,
                y: enemy.y - toGoal.y * 42,
                r: 11,
                arm: 0.7,
                life: 8,
                ownerTank: enemy,
              });
            }
            const targetDistance = distance(enemy, target);
            const aimError = Math.abs(
              Math.atan2(
                Math.sin(enemy.turretAngle - Math.atan2(aimDy, aimDx)),
                Math.cos(enemy.turretAngle - Math.atan2(aimDy, aimDx)),
              ),
            );
            if (
              enemy.reloadLeft <= 0 &&
              targetDistance < 880 &&
              aimError < 0.34 &&
              hasLineOfSight(enemy, target)
            ) {
              enemyFire(enemy, target);
              enemy.reloadLeft = enemy.reload * rand(0.78, 1.25);
            }
          }
        }

        function chooseEnemyTarget(enemy) {
          if (!isCompetitiveMode()) return player;
          const candidates = player.hp > 0 ? [player] : [];
          for (const other of enemies) {
            if (other !== enemy && other.hp > 0) candidates.push(other);
          }
          if (!candidates.length) return player;
          return (
            candidates.reduce((best, target) => {
              const weak = target.hp / target.maxHp;
              const score =
                distance(enemy, target) * 0.82 +
                weak * 260 -
                (target.score || target.points || 0) * 0.18;
              return !best || score < best.score ? { target, score } : best;
            }, null).target || player
          );
        }

        function nearestPart(entity) {
          let best = null;
          for (const part of parts) {
            const d = distance(entity, part);
            if (!best || d < best.d) best = { part, d };
          }
          return best ? best.part : null;
        }

        function findFlankPoint(enemy, target) {
          let best = null;
          const preferred =
            enemy.type === "rocket" ? 610 : enemy.type === "heavy" ? 390 : 450;
          for (let i = 0; i < 14; i++) {
            const angle = (Math.PI * 2 * i) / 14 + enemy.strafe * 0.28;
            const point = {
              x: clamp(
                target.x + Math.cos(angle) * preferred,
                120,
                WORLD - 120,
              ),
              y: clamp(
                target.y + Math.sin(angle) * preferred,
                120,
                WORLD - 120,
              ),
            };
            if (circleHitsWall(point.x, point.y, enemy.size * 0.5)) continue;
            const lineBonus = hasLineOfSight(point, target) ? -260 : 0;
            const score =
              distance(enemy, point) + lineBonus + Math.random() * 80;
            if (!best || score < best.score) best = { point, score };
          }
          return best ? best.point : target;
        }

        function dodgeVector(enemy) {
          let x = 0;
          let y = 0;
          for (const bullet of bullets) {
            if (bullet.ownerTank === enemy) continue;
            const dx = enemy.x - bullet.x;
            const dy = enemy.y - bullet.y;
            const d = Math.hypot(dx, dy);
            if (d > 170) continue;
            const side = norm(-bullet.vy, bullet.vx);
            const sign = dx * side.x + dy * side.y > 0 ? 1 : -1;
            const power = (1 - d / 170) * 1.7;
            x += side.x * sign * power;
            y += side.y * sign * power;
          }
          return { x, y };
        }

        function enemyFire(enemy, target) {
          const spread =
            enemy.type === "boss"
              ? 0.18
              : enemy.type === "rocket" || enemy.artillery
                ? 0.05
                : 0.08;
          const count = enemy.type === "boss" ? 3 : 1;
          for (let i = 0; i < count; i++) {
            const offset = count === 1 ? 0 : (i - 1) * spread;
            const lead = target
              ? leadAngle(
                  enemy,
                  target,
                  enemy.type === "rocket" || enemy.artillery ? 430 : 390,
                )
              : enemy.turretAngle;
            fireBullet(
              "enemy",
              enemy.x + Math.cos(enemy.turretAngle) * enemy.size * 0.55,
              enemy.y + Math.sin(enemy.turretAngle) * enemy.size * 0.55,
              lead + offset + rand(-0.035, 0.035),
              {
                damage: enemy.damage,
                bounces: enemy.type === "boss" || enemy.bounces > 1 ? 1 : 0,
                speed: enemy.artillery
                  ? 360
                  : enemy.type === "rocket"
                    ? 430
                    : 390,
                color: enemy.artillery
                  ? "#a05a2c"
                  : enemy.type === "rocket"
                    ? "#6d5ba8"
                    : "#b3352f",
                size: enemy.type === "rocket" || enemy.artillery ? 7 : 5.5,
                blast: enemy.artillery ? 105 : enemy.type === "rocket" ? 70 : 0,
                life: 2.9,
                ownerTank: enemy,
              },
            );
          }
        }

        function leadAngle(shooter, target, speed) {
          const tx = target.x + (target.vx || 0) * 0.32;
          const ty = target.y + (target.vy || 0) * 0.32;
          return Math.atan2(ty - shooter.y, tx - shooter.x);
        }

        function hasLineOfSight(a, b) {
          const steps = 16;
          for (let i = 1; i < steps; i++) {
            const t = i / steps;
            const x = lerp(a.x, b.x, t);
            const y = lerp(a.y, b.y, t);
            for (const wall of walls) {
              if (
                Math.abs(x - wall.x) < wall.w / 2 &&
                Math.abs(y - wall.y) < wall.h / 2
              )
                return false;
            }
          }
          return true;
        }

        function updateBullets(dt) {
          for (let i = bullets.length - 1; i >= 0; i--) {
            const bullet = bullets[i];
            bullet.life -= dt;
            bullet.px = bullet.x;
            bullet.py = bullet.y;
            bullet.x += bullet.vx * dt;
            bullet.y += bullet.vy * dt;
            if (
              bullet.life <= 0 ||
              bullet.x < -80 ||
              bullet.x > WORLD + 80 ||
              bullet.y < -80 ||
              bullet.y > WORLD + 80
            ) {
              bullets.splice(i, 1);
              continue;
            }
            const wall = walls.find((item) =>
              circleRectHit(bullet.x, bullet.y, bullet.r, item),
            );
            if (wall) {
              hitWall(wall, bullet);
              if (bullet.bounces > 0 && wall.type === "steel") {
                const fromLeft =
                  bullet.px < wall.x - wall.w / 2 ||
                  bullet.px > wall.x + wall.w / 2;
                if (fromLeft) bullet.vx *= -1;
                else bullet.vy *= -1;
                bullet.bounces -= 1;
                bullet.x = bullet.px;
                bullet.y = bullet.py;
                spark(bullet.x, bullet.y, bullet.color, 10);
              } else {
                explodeBullet(bullet);
                bullets.splice(i, 1);
              }
              continue;
            }
            const barrel = barrels.find(
              (item) =>
                item.alive && distance(item, bullet) < item.r + bullet.r,
            );
            if (barrel) {
              barrel.hp -= bullet.damage;
              explodeBullet(bullet);
              bullets.splice(i, 1);
              if (barrel.hp <= 0) explodeBarrel(barrel);
              continue;
            }
            if (bullet.owner === "player") {
              const targetIndex = enemies.findIndex(
                (enemy) =>
                  distance(enemy, bullet) < enemy.size * 0.48 + bullet.r,
              );
              if (targetIndex >= 0) {
                const enemy = enemies[targetIndex];
                const side = hitSide(enemy, bullet);
                damageEnemy(
                  enemy,
                  bullet.damage * side.mult,
                  side.name,
                  player,
                );
                burst(bullet.x, bullet.y, bullet.color, 10);
                if (bullet.blast > 0)
                  explosions.push({
                    x: bullet.x,
                    y: bullet.y,
                    r: 20,
                    max: bullet.blast,
                    life: 0.26,
                    damage: bullet.damage * 0.5,
                    owner: "player",
                    color: bullet.color,
                    ownerTank: player,
                  });
                if (bullet.pierce > 0) bullet.pierce -= 1;
                else bullets.splice(i, 1);
              }
            } else {
              let consumed = false;
              if (
                player.hp > 0 &&
                bullet.ownerTank !== player &&
                distance(player, bullet) < player.size * 0.48 + bullet.r
              ) {
                damagePlayer(bullet.damage, bullet.ownerTank, bullet.x, bullet.y);
                burst(bullet.x, bullet.y, bullet.color, 12);
                if (bullet.blast > 0)
                  explosions.push({
                    x: bullet.x,
                    y: bullet.y,
                    r: 20,
                    max: bullet.blast,
                    life: 0.26,
                    damage: bullet.damage * 0.45,
                    owner: "enemy",
                    color: bullet.color,
                    ownerTank: bullet.ownerTank,
                  });
                bullets.splice(i, 1);
                consumed = true;
              }
              if (!consumed && isCompetitiveMode()) {
                const target = enemies.find(
                  (enemy) =>
                    enemy !== bullet.ownerTank &&
                    distance(enemy, bullet) < enemy.size * 0.48 + bullet.r,
                );
                if (target) {
                  const side = hitSide(target, bullet);
                  damageEnemy(
                    target,
                    bullet.damage * side.mult,
                    side.name,
                    bullet.ownerTank,
                  );
                  burst(bullet.x, bullet.y, bullet.color, 10);
                  if (bullet.blast > 0)
                    explosions.push({
                      x: bullet.x,
                      y: bullet.y,
                      r: 20,
                      max: bullet.blast,
                      life: 0.26,
                      damage: bullet.damage * 0.5,
                      owner: "enemy",
                      color: bullet.color,
                      ownerTank: bullet.ownerTank,
                    });
                  bullets.splice(i, 1);
                }
              }
            }
          }
        }

        function hitWall(wall, bullet) {
          if (wall.type !== "brick") return;
          wall.hp -= bullet.damage;
          spark(bullet.x, bullet.y, "#b45309", 8);
          if (wall.hp <= 0) {
            const index = walls.indexOf(wall);
            if (index >= 0) walls.splice(index, 1);
            if (!isCompetitiveMode()) game.score += 8;
            burst(wall.x, wall.y, "#ffb25f", 18);
          }
        }

        function explodeBullet(bullet) {
          if (bullet.blast > 0) {
            explosions.push({
              x: bullet.x,
              y: bullet.y,
              r: 20,
              max: bullet.blast,
              life: 0.28,
              damage: bullet.damage * 0.55,
              owner: bullet.owner,
              color: bullet.color,
              ownerTank: bullet.ownerTank || null,
            });
          } else {
            spark(bullet.x, bullet.y, bullet.color, 7);
          }
        }

        function hitSide(enemy, bullet) {
          const incoming = Math.atan2(bullet.vy, bullet.vx);
          const rear = Math.cos(incoming - enemy.bodyAngle);
          const flank = Math.abs(Math.sin(incoming - enemy.bodyAngle));
          if (rear > 0.48) return { name: "背板", mult: 1.55 };
          if (flank > 0.72) return { name: "侧舷", mult: 1.25 };
          return { name: "首面", mult: 0.82 };
        }

        function damageEnemy(enemy, amount, side, killer, silent) {
          const armorFactor =
            side === "首面" || side === "front"
              ? 1 - (enemy.frontArmor || 0)
              : 1;
          enemy.hp -= Math.max(1, amount * armorFactor);
          if (!silent)
            addFloater(
              side === "front" ? "-损伤" : side,
              enemy.x,
              enemy.y - enemy.size * 0.6,
              side === "首面" || side === "front" ? "#5b6b80" : "#b45309",
            );
          if (killer) {
            enemy.assistList = enemy.assistList || [];
            enemy.assistList.push({
              by: killer,
              time: performance.now() / 1000,
            });
          }
          if (enemy.hp <= 0) {
            const index = enemies.indexOf(enemy);
            if (index >= 0) enemies.splice(index, 1);
            awardKill(killer, enemy);
            if (enemy.type === "boss")
              garageSave.bosses = (garageSave.bosses || 0) + 1;
            if (isCompetitiveMode()) awardAssists(enemy, killer);
            burst(
              enemy.x,
              enemy.y,
              enemy.color,
              enemy.type === "boss" ? 70 : 28,
            );
            explosions.push({
              x: enemy.x,
              y: enemy.y,
              r: 26,
              max: enemy.type === "boss" ? 260 : 110,
              life: 0.38,
              damage: enemy.type === "boss" ? 42 : 22,
              owner: "player",
              color: enemy.color,
              visualOnly: true,
            });
            dropParts(
              enemy.x,
              enemy.y,
              enemy.type === "boss" ? 6 : enemy.elite ? 3 : 2,
            );
            if (isRespawnMode()) {
              respawnArenaBot(enemy);
            }
          }
        }

        function awardAssists(victim, killer) {
          const list = victim.assistList || [];
          const now = performance.now() / 1000;
          const seen = new Set();
          for (let k = list.length - 1; k >= 0; k--) {
            const a = list[k];
            if (now - a.time > 5) continue;
            if (a.by === killer) continue;
            if (seen.has(a.by)) continue;
            seen.add(a.by);
            const pts = Math.max(1, Math.round((victim.score || 0) * 0.25));
            if (a.by === player) {
              game.score += pts;
              addFloater(`助攻+${pts}`, victim.x, victim.y - 18, "#3f7d5a");
            } else if (a.by) {
              a.by.points = (a.by.points || 0) + pts;
            }
          }
        }

        function awardKill(killer, victim) {
          const value = Math.round(victim.score);
          if (killer === player || !isCompetitiveMode()) {
            game.score += value;
            player.kills += 1;
            buzz(12);
            if (!isCompetitiveMode())
              healPlayer(victim.type === "boss" ? 30 : 4);
            addFloater(`+${value}`, victim.x, victim.y, "#3f7d5a");
            return;
          }
          if (killer) {
            killer.points = (killer.points || 0) + value;
            killer.kills = (killer.kills || 0) + 1;
            addFloater(`+${value}`, victim.x, victim.y, "#6d5ba8");
          }
        }

        function damagePlayer(amount, killer, sourceX, sourceY) {
          const now = performance.now() / 1000;
          if (player.shieldUntil > now) {
            spark(player.x, player.y, "#1d4e89", 12);
            return;
          }
          let dealt = amount;
          if (typeof sourceX === "number" && typeof sourceY === "number") {
            const toSource = Math.atan2(sourceY - player.y, sourceX - player.x);
            let diff = toSource - player.bodyAngle;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            const facing = Math.abs(diff);
            if (facing <= Math.PI / 2)
              dealt = amount * (1 - (player.frontArmor || 0) * 0.5);
            else if (facing >= Math.PI * 0.72) dealt = amount * 1.22;
          } else {
            dealt = amount * (1 - (player.frontArmor || 0) * 0.5);
          }
          player.hp -= dealt;
          player.hp = Math.max(0, player.hp);
          buzz(26);
          if (player.hp <= 0 && killer && isCompetitiveMode()) {
            killer.points = (killer.points || 0) + 260;
            killer.kills = (killer.kills || 0) + 1;
          }
          shake(8);
          addFloater(
            `-${Math.round(dealt)}`,
            player.x,
            player.y - 34,
            "#b3352f",
          );
        }

        function healPlayer(amount) {
          player.hp = Math.min(player.maxHp, player.hp + amount);
        }

        function updateMines(dt) {
          for (let i = mines.length - 1; i >= 0; i--) {
            const mine = mines[i];
            mine.arm -= dt;
            mine.life -= dt;
            let target =
              mine.owner === "player"
                ? enemies.find(
                    (enemy) => distance(enemy, mine) < enemy.size * 0.48 + 24,
                  )
                : distance(player, mine) < player.size * 0.48 + 24;
            if (!target && isCompetitiveMode() && mine.owner !== "player") {
              target = enemies.find(
                (enemy) =>
                  enemy !== mine.ownerTank &&
                  distance(enemy, mine) < enemy.size * 0.48 + 24,
              );
            }
            if ((mine.arm <= 0 && target) || mine.life <= 0) {
              explosions.push({
                x: mine.x,
                y: mine.y,
                r: 18,
